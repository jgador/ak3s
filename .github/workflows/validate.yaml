name: Validate AK3S
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make verify release
      - run: go test -tags integration -run 'TestPinned(Charts|Installer|K3sArtifacts)' -v ./internal/ak3s
      - uses: actions/upload-artifact@v4
        with:
          name: ak3s-linux
          path: dist/
