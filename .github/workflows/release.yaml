name: Release AK3S
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - run: make verify
      - run: go test -tags integration -run TestPinnedCharts -v ./internal/ak3s
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dashboard image
        id: dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jgador/ak3s-dashboard:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/jgador/ak3s
      - name: Build static release binaries
        env:
          VERSION: ${{ github.ref_name }}
          DASHBOARD_IMAGE: ghcr.io/jgador/ak3s-dashboard@${{ steps.dashboard.outputs.digest }}
        run: make release
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes
