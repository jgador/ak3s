name: Release AK3S
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the selected release branch (for example, v0.1.0)'
        required: true
        type: string
      latest:
        description: 'Mark as the latest release (leave off for older release lines)'
        type: boolean
        default: false
concurrency:
  group: ak3s-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release source and unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make verify
      - run: go test -tags integration -run 'TestPinned(Charts|Installer|K3sArtifacts)' -v ./internal/ak3s
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci && npm test
        working-directory: dashboard
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reserve the version at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" > /dev/null
      - name: Publish dashboard image
        id: dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jgador/ak3s-dashboard:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/jgador/ak3s
      - name: Build static release binaries
        env:
          DASHBOARD_IMAGE: ghcr.io/jgador/ak3s-dashboard@${{ steps.dashboard.outputs.digest }}
        run: make release
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ inputs.latest }}
        run: |
          gh release create "$VERSION" dist/ak3s_linux_amd64 dist/ak3s_linux_arm64 \
            dist/install.sh dist/checksums.txt --verify-tag --generate-notes \
            --latest="$MAKE_LATEST"
          {
            echo "Published $VERSION from $GITHUB_REF at $GITHUB_SHA."
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
