name: Release AK3S
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - run: make verify
      - run: go test -tags integration -run TestPinnedCharts -v ./internal/ak3s
      - name: Build static release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make release
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --generate-notes
