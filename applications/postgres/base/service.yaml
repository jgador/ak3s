apiVersion: v1
kind: Service
metadata:
  name: psql-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: psql-server
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: psql-server-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: psql-server
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
