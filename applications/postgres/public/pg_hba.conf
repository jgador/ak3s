# Retain the official image's local socket access for initialization and exec.
local all all trust

# Reject unencrypted TCP connections, including connections from cluster pods.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject

# Remote access also requires a SCRAM password. Restrict public source addresses
# at the provider firewall and in the host's Kubernetes forwarding rules.
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
