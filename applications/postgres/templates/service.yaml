apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    ak3s.io/managed-by: ak3s
    ak3s.io/application: {{ .Values.application | quote }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    ak3s.io/application: {{ .Values.application | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  labels:
    ak3s.io/managed-by: ak3s
    ak3s.io/application: {{ .Values.application | quote }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    ak3s.io/application: {{ .Values.application | quote }}
