# Existing Hetzner Cloud Ubuntu 24.04 / Debian 12+ VMs, reachable over SSH.
# Copy to inventory.yaml and replace the documentation addresses.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    k3s_servers:
      hosts:
        server-1:
          ansible_host: 192.0.2.10
          ak3s_node_ip: 192.0.2.10
    k3s_agents:
      hosts: {}
      # worker-1:
      #   ansible_host: 192.0.2.11
      #   ak3s_node_ip: 192.0.2.11
      # For private networks, use the private address for ak3s_node_ip.
      # ak3s_flannel_iface: ens4
