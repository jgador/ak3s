- name: Render K3s configuration
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
  no_log: true
  notify: Restart K3s

- name: Inspect installed version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: ak3s_installed_version
  failed_when: false
  changed_when: false

- name: Record AK3S ownership before installation so interrupted installs can resume
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/ak3s-managed
    content: 'Managed by AK3S. Configuration: /etc/rancher/k3s/config.yaml'
    mode: '0600'

- name: Install the pinned K3s release
  ansible.builtin.command: /usr/local/lib/ak3s-install.sh
  environment:
    INSTALL_K3S_VERSION: '{{ ak3s_k3s_version }}'
    INSTALL_K3S_EXEC: '{{ ak3s_mode }}'
  when: ak3s_installed_version.rc != 0 or ('k3s version ' ~ ak3s_k3s_version ~ ' ') not in ak3s_installed_version.stdout
  changed_when: true
  notify: Restart K3s

- name: Apply configuration changes before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Enable K3s service
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if ak3s_mode == 'server' else 'k3s-agent' }}"
    enabled: true
    state: started
