apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ak3s-metrics-kubelet-proxy
rules:
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ak3s-metrics-kubelet-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ak3s-metrics-kubelet-proxy
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: observability
