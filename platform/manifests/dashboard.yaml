apiVersion: v1
kind: Namespace
metadata:
  name: ak3s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: ak3s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ak3s-dashboard
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ak3s-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ak3s-dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: ak3s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard
  namespace: ak3s
data:
  metadata.json: {{quote .Metadata}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: ak3s
  labels:
    app.kubernetes.io/name: ak3s-dashboard
    app.kubernetes.io/instance: ak3s-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ak3s-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ak3s-dashboard
      annotations:
        checksum/config: {{quote .Checksum}}
    spec:
      serviceAccountName: dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{quote .Image}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 30
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: configuration
              mountPath: /etc/ak3s-dashboard
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ak3s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ak3s-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Kubernetes port-forwarding reaches the pod without opening pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: ak3s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ak3s-dashboard
  policyTypes: [Ingress]
  ingress: []
