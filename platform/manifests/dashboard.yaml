apiVersion: v1
kind: Namespace
metadata:
  name: ak3s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: ak3s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ak3s-dashboard
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ak3s-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ak3s-dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: ak3s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard
  namespace: ak3s
data:
  metadata.json: {{quote .Metadata}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: ak3s
  labels:
    app.kubernetes.io/name: ak3s-dashboard
    app.kubernetes.io/instance: ak3s-dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ak3s-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ak3s-dashboard
      annotations:
        checksum/config: {{quote .Checksum}}
    spec:
      serviceAccountName: dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{quote .Image}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 30
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: configuration
              mountPath: /etc/ak3s-dashboard
              readOnly: true
{{- if .Hostname }}
            - name: authentication
              mountPath: /etc/ak3s-dashboard-auth
              readOnly: true
{{- end }}
      volumes:
        - name: configuration
          configMap:
            name: dashboard
{{- if .Hostname }}
        - name: authentication
          secret:
            secretName: {{quote .AuthSecret}}
            items:
              - key: username
                path: username
              - key: password
                path: password
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ak3s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ak3s-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Kubernetes port-forwarding reaches the pod without opening pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: ak3s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ak3s-dashboard
  policyTypes: [Ingress]
{{- if .Hostname }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: nginx-ingress
              app.kubernetes.io/name: nginx-ingress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: ak3s
  labels:
    app.kubernetes.io/managed-by: ak3s
    app.kubernetes.io/name: ak3s-dashboard
  annotations:
    cert-manager.io/cluster-issuer: {{quote .Issuer}}
    # NGINX rejects separate Ingress resources claiming the same hostname.
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/ssl-redirect: "true"
    nginx.org/websocket-services: dashboard
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - secretName: dashboard-tls
      hosts: [{{quote .Hostname}}]
  rules:
    - host: {{quote .Hostname}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
{{- else }}
  ingress: []
{{- end }}
