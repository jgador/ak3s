fullnameOverride: headlamp
replicaCount: 1
service:
  type: ClusterIP
  port: 80
clusterRoleBinding:
  create: false
config:
  inCluster: true
  unsafeUseServiceAccountToken: false
  oidc:
    secret:
      create: false
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
ingress:
  enabled: false
