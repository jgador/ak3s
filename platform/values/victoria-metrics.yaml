serviceAccount:
  name: victoria-metrics
server:
  fullnameOverride: victoria-metrics
  replicaCount: 1
  retentionPeriod: 7d
  persistentVolume:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  extraArgs:
    memory.allowedPercent: "60"
    storage.minFreeDiskSpaceBytes: 1GiB
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: victoria-metrics
          static_configs:
            - targets: [localhost:8428]
        - job_name: victoria-logs
          static_configs:
            - targets: [victoria-logs.observability.svc:9428]
        - job_name: nginx-ingress
          static_configs:
            - targets: [nginx-ingress-prometheus-service.ingress-nginx.svc:9113]
        - job_name: kubernetes-apiserver
          scheme: https
          static_configs:
            - targets: [kubernetes.default.svc:443]
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        # Proxy via the API server to verify TLS against the cluster CA.
        - job_name: kubernetes-kubelet
          scheme: https
          kubernetes_sd_configs:
            - role: node
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          relabel_configs:
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics
            - source_labels: [__meta_kubernetes_node_name]
              target_label: node
        - job_name: kubernetes-cadvisor
          scheme: https
          honor_timestamps: false
          kubernetes_sd_configs:
            - role: node
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          relabel_configs:
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            - source_labels: [__meta_kubernetes_node_name]
              target_label: node
        # Opt-in metrics through Service annotations. Filter by the declared
        # port before scraping to avoid scraping DNS or duplicate endpoints.
        - job_name: kubernetes-services
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__address__]
              regex: .+:([0-9]+)
              target_label: __tmp_endpoint_port
            - source_labels: [__tmp_endpoint_port, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: keep_if_equal
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              regex: (https?)
              target_label: __scheme__
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              regex: (.+)
              target_label: __metrics_path__
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              target_label: service
