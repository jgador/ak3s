fullnameOverride: victoria-logs-collector
remoteWrite:
  - url: http://victoria-logs.observability.svc:9428
    maxDiskUsagePerURL: 1GiB
collector:
  includePodLabels: true
  includePodAnnotations: false
resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    memory: 256Mi

# Collect from server nodes as well if users add control-plane taints.
tolerations:
  - operator: Exists

# The collector follows /var/log/containers symlinks into /var/log/pods.
# Mount both paths without mounting all of /var/lib.
defaultVolumes:
  - name: varlog
    hostPath:
      path: /var/log/pods
      type: Directory
  - name: containerlinks
    hostPath:
      path: /var/log/containers
      type: Directory
defaultVolumeMounts:
  - name: varlog
    mountPath: /var/log/pods
    readOnly: true
  - name: containerlinks
    mountPath: /var/log/containers
    readOnly: true
