cluster_name: ak3s
kubernetes_api_endpoint: 127.0.0.1
tls_sans: []

# Required when platform is enabled. There is no safe default contact address.
acme_email: ""
acme_environment: staging
storage_class: local-path
metrics_retention: 7d
metrics_storage: 10Gi
logs_retention: 7d
logs_storage: 10Gi
logs_max_disk: 8GiB
# Empty selects the dashboard image supplied by this AK3S release.
dashboard_image: ""
# Empty disables shared HTTPS access.
dashboard_hostname: ""
# Enable the same tool paths through a local dashboard port-forward.
# A nonempty dashboard_hostname enables these paths automatically.
dashboard_shared_paths: false
# Required in namespace ak3s when dashboard_hostname is set.
dashboard_auth_secret: dashboard-auth
headlamp_hostname: ""
platform: true
node:
  role: server
  name: ""
  ip: ""
  external_ip: ""
  flannel_iface: ""
  datastore: sqlite
  server_count: 1
  join: false
  token_file: ""
helm_values: {}
